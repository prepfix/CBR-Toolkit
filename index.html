<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#0a2a6b"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CBR"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icons/icon-192.png"><script>if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script></head><body>
<title>CBR Toolkit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one column. Header, tabs, then Today / Read / Plan / Journal / Settings. Reader and Summary replace the tabs. */
  :root {
    --bg: #f2f4f8; --surface: #ffffff; --fg: #17212f; --muted: #55627a; --line: #d8dee8;
    --accent: #b84e08; --accent-fg: #ffffff; --ok: #17703f; --hl: #ffe9cc; --chip: #e7ebf2; --bar: #d8dee8;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --scripture: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1622; --surface: #172131; --fg: #e8edf5; --muted: #9aa8bc; --line: #2a384d;
      --accent: #f29a4a; --accent-fg: #1a1206; --ok: #5cc98d; --hl: #3a2a14; --chip: #22304a; --bar: #2a384d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1622; --surface: #172131; --fg: #e8edf5; --muted: #9aa8bc; --line: #2a384d;
    --accent: #f29a4a; --accent-fg: #1a1206; --ok: #5cc98d; --hl: #3a2a14; --chip: #22304a; --bar: #2a384d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 16px; line-height: 1.55;
    padding-block: 18px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .muted { color: var(--muted); }
  p { margin: 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .org { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .org b { display: block; font-size: 1.4rem; letter-spacing: .06em; line-height: 1.15; }
  .org small { display: block; font-size: .72rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .logo { width: 58px; height: 58px; flex: none; border-radius: 12px; border: 2px dashed var(--line); display: flex; align-items: center; justify-content: center; text-align: center; font-size: .62rem; font-weight: 700; color: var(--muted); overflow: hidden; line-height: 1.2; padding: 4px; }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .brand b { font-size: 1.45rem; letter-spacing: .08em; display: block; line-height: 1.1; }
  .brand span { font-size: .75rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .stats { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
  .stats div { text-align: right; }
  .stats b { display: block; font-size: 1.35rem; line-height: 1.1; color: var(--accent); }
  .stats span { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  nav { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font: inherit; font-weight: 600; padding: 10px 12px; cursor: pointer; white-space: nowrap; }
  nav button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { margin: 0; font-size: 1.15rem; }
  .big { font-size: 1.6rem; font-weight: 700; line-height: 1.2; text-wrap: balance; }
  .btn { appearance: none; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 10px; font: inherit; font-weight: 600; padding: 9px 14px; cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .primary { appearance: none; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 700; padding: 13px 16px; cursor: pointer; }
  .primary:disabled { background: var(--bar); color: var(--muted); cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  select, input[type="time"], input[type="date"], input[type="number"] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; max-width: 100%; }
  textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; min-height: 60px; resize: vertical; }
  .bar { height: 8px; background: var(--bar); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--chip); border-radius: 99px; padding: 4px 12px; font-size: .85rem; font-weight: 600; color: var(--muted); }
  .chip.on { background: var(--ok); color: #fff; }

  .chap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .chap:first-of-type { border-top: 0; }
  .chap b { display: block; }
  .chap small { color: var(--muted); }
  .chap.done b { color: var(--ok); }

  details { border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  summary span { color: var(--muted); font-weight: 500; font-size: .85rem; }
  .daybtn { display: flex; width: 100%; justify-content: space-between; gap: 10px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); color: var(--fg); font: inherit; padding: 8px 0; cursor: pointer; }
  .daybtn small { color: var(--muted); white-space: nowrap; }
  .daybtn.cur { color: var(--accent); font-weight: 700; }
  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .books div { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; min-width: 0; }
  .books small { color: var(--muted); }

  .reader { display: flex; flex-direction: column; gap: 12px; }
  .rtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rtop h1 { margin: 0; font-family: var(--scripture); font-size: 1.8rem; font-weight: 500; line-height: 1.15; flex: 1; min-width: 0; }
  .verses { font-family: var(--scripture); font-size: 1.25rem; line-height: 1.7; display: flex; flex-direction: column; gap: 2px; }
  .vline { display: flex; gap: 8px; align-items: flex-start; border-radius: 10px; padding: 6px 8px; border-left: 4px solid transparent; }
  .vline.cur { background: var(--hl); border-left-color: var(--accent); }
  .vline .num { font-family: var(--ui); font-size: .7rem; font-weight: 700; color: var(--accent); width: 22px; flex: none; padding-top: .55em; }
  .vline .txt { all: unset; flex: 1; min-width: 0; cursor: pointer; }
  .vline .txt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .nbtn { appearance: none; flex: none; background: var(--chip); color: var(--muted); border: 0; border-radius: 8px; font: 600 .75rem var(--ui); padding: 6px 9px; cursor: pointer; }
  .nbtn.has { background: var(--accent); color: var(--accent-fg); }
  .ned { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 2px 0 8px 30px; font-family: var(--ui); }
  .card > .ned { margin: 0; border: 0; padding: 0; background: none; }
  .ned label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 700; }
  .ctl { position: sticky; bottom: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; box-shadow: 0 -6px 18px rgba(0,0,0,.08); }
  .ctl .msg { flex-basis: 100%; font-size: .85rem; color: var(--muted); min-height: 1.2em; }
  .play { min-width: 96px; }

  .sumsec h3 { margin: 0 0 6px; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .sumsec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
  .sumsec li b { font-weight: 700; }
  .sumsec li { overflow-wrap: anywhere; white-space: pre-wrap; }
  .banner { background: var(--hl); border-radius: 10px; padding: 12px 14px; font-weight: 700; }
  details.guide { padding-top: 16px; border-top: 1px solid var(--line); }
  .guide .sample { font-weight: 700; font-size: .85rem; letter-spacing: .02em; }
  .guide .gb { border-left: 3px solid var(--accent); padding-left: 10px; display: flex; flex-direction: column; gap: 2px; }
  .guide .gb strong { font-size: .75rem; letter-spacing: .08em; color: var(--accent); }
  .note { font-size: .85rem; color: var(--muted); }
  [hidden] { display: none !important; }

  /* Logo (top left) with glow */
  .logo { width: 64px; height: 64px; border: 0 !important; padding: 0 !important; border-radius: 50% !important; background: #fff; overflow: visible !important;
    box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 0 14px 3px rgba(0,153,255,.55), 0 0 28px 8px rgba(255,150,30,.35); animation: logoGlow 3.2s ease-in-out infinite; }
  .logo img { border-radius: 50%; }
  .org { padding-left: 6px; }
  @keyframes logoGlow {
    0%,100% { box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 0 12px 2px rgba(0,153,255,.45), 0 0 24px 6px rgba(255,150,30,.25); }
    50% { box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 0 20px 6px rgba(0,190,255,.8), 0 0 40px 14px rgba(255,150,30,.5); }
  }
  /* Footer */
  .devfoot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; margin: 0; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(0,0,0,.08);
    padding: 8px 12px max(8px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 2px 10px; text-align: center; font-size: .72rem; }
  .devfoot strong { font-size: .72rem; letter-spacing: .1em; color: var(--muted); }
  .devfoot a { color: var(--accent); font-weight: 700; text-decoration: none; font-variant-numeric: tabular-nums; }
  .devfoot em { font-style: normal; font-weight: 800; letter-spacing: .08em; color: var(--accent); }
  body { padding-bottom: 84px !important; }
  /* Launch splash */
  #splash { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; color: #fff;
    padding: max(32px, env(safe-area-inset-top)) 20px max(26px, env(safe-area-inset-bottom));
    background: radial-gradient(circle at 50% 38%, #123a8f 0%, #0a2a6b 45%, #04122e 100%); transition: opacity .6s ease, visibility .6s; cursor: pointer; }
  #splash.out { opacity: 0; visibility: hidden; }
  #splash .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  #splash .glowicon { position: relative; width: min(58vw, 260px); aspect-ratio: 1; border-radius: 50%; }
  #splash .glowicon::before { content: ""; position: absolute; inset: -18%; border-radius: 50%; z-index: 0;
    background: radial-gradient(circle, rgba(0,200,255,.75) 0%, rgba(0,140,255,.45) 35%, rgba(255,150,30,.28) 55%, transparent 72%); animation: splashGlow 2.4s ease-in-out infinite; }
  #splash .glowicon img { position: relative; z-index: 1; width: 100%; height: 100%; border-radius: 50%; background: #fff; display: block;
    box-shadow: 0 0 0 3px rgba(255,255,255,.95), 0 0 26px 6px rgba(0,190,255,.8), 0 0 60px 18px rgba(255,150,30,.45); animation: splashPop .9s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes splashGlow { 0%,100% { transform: scale(.92); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
  @keyframes splashPop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #splash h1 { margin: 0; font-size: clamp(1.05rem, 4.6vw, 1.5rem); letter-spacing: .12em; font-weight: 800; }
  #splash h2 { margin: 2px 0 0; font-size: clamp(1.9rem, 9vw, 3rem); letter-spacing: .06em; font-weight: 800; color: #ffb347; text-shadow: 0 0 18px rgba(255,150,30,.55); }
  #splash .sub { font-size: .8rem; letter-spacing: .18em; text-transform: uppercase; color: #bcd3ff; }
  #splash .dev { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; letter-spacing: .12em; color: #cfe0ff; }
  #splash .dev b { font-size: .95rem; letter-spacing: .1em; color: #fff; }
  #splash .dev em { font-style: normal; font-weight: 800; letter-spacing: .1em; color: #ffb347; font-size: 1rem; }
  #splash { height: 100vh; height: 100dvh; width: 100%; top: 0; left: 0; bottom: auto; right: auto; justify-content: center; }
  #splash .mid { padding-bottom: 80px; }
  #splash .dev { position: absolute; left: 0; right: 0; bottom: 0; align-items: center; padding: 10px 12px max(14px, env(safe-area-inset-bottom)); background: rgba(4,18,46,.55); border-top: 1px solid rgba(255,255,255,.18); }
  @media (prefers-reduced-motion: reduce) { #splash .glowicon::before, #splash .glowicon img, .logo { animation: none; } }

  /* ===== Brand theme: navy + royal blue + orange + white, blended ===== */
  :root { --blue: #1457d6; --navy: #0a2a6b; --orange: #f28c0f; --head: #0a2a6b; --line2: #c9d6ee; --foot-h: calc(40px + env(safe-area-inset-bottom, 0px));
    --bg: #eef4ff; --bgimg: linear-gradient(180deg, #e3eeff 0%, #f5f8ff 38%, #fff6e8 100%);
    --surface: #ffffff; --fg: #17212f; --muted: #54627c; --line: #d6e0f1; --accent: #c75c05; --accent-fg: #ffffff;
    --hl: #fff0d9; --chip: #e7eefb; --bar: #dbe4f4; --btn: linear-gradient(135deg, #d9700a, #bf5504); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14161b; --bgimg: linear-gradient(180deg, #151a26 0%, #14161b 45%, #1b1712 100%);
      --surface: #1e2129; --fg: #eef1f6; --muted: #a8b0bd; --line: #343946; --line2: #3c4352; --head: #ffffff; --blue: #6aa9ff;
      --accent: #ffa43a; --accent-fg: #1b1204; --hl: #3b2c15; --chip: #2b303b; --bar: #343946; --btn: linear-gradient(135deg, #ffb347, #ff9a1f); }
  }
  :root[data-theme="dark"] { --bg: #14161b; --bgimg: linear-gradient(180deg, #151a26 0%, #14161b 45%, #1b1712 100%);
    --surface: #1e2129; --fg: #eef1f6; --muted: #a8b0bd; --line: #343946; --line2: #3c4352; --head: #ffffff; --blue: #6aa9ff;
    --accent: #ffa43a; --accent-fg: #1b1204; --hl: #3b2c15; --chip: #2b303b; --bar: #343946; --btn: linear-gradient(135deg, #ffb347, #ff9a1f); }
  body { background: var(--bgimg) fixed, var(--bg); padding-bottom: calc(var(--foot-h) + 28px) !important; }

  /* Header banner */
  header { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 14px 14px 16px; border-radius: 18px; color: #fff;
    background: linear-gradient(125deg, #082357 0%, #1457d6 62%, #1e8ee8 100%); box-shadow: 0 6px 18px rgba(10,42,107,.25), inset 0 -4px 0 var(--orange); }
  .org { padding-left: 0; gap: 14px; }
  .org b { color: #fff; font-size: 1.55rem; letter-spacing: .07em; }
  .org small { color: #cfe0ff; }
  .org small:last-child { color: #ffd08a; }
  .logo { width: 68px; height: 68px; box-shadow: 0 0 0 3px #fff, 0 0 16px 4px rgba(255,170,60,.75), 0 0 32px 10px rgba(80,190,255,.45); animation: logoGlow2 3.2s ease-in-out infinite; }
  @keyframes logoGlow2 { 0%,100% { box-shadow: 0 0 0 3px #fff, 0 0 12px 3px rgba(255,170,60,.55), 0 0 24px 6px rgba(80,190,255,.3); }
    50% { box-shadow: 0 0 0 3px #fff, 0 0 22px 7px rgba(255,180,70,.95), 0 0 40px 14px rgba(80,190,255,.6); } }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stats div { text-align: center; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); border-radius: 12px; padding: 7px 6px; }
  .stats b { color: #ffc266; font-size: 1.4rem; }
  .stats span { color: #dbe8ff; }
  @media (min-width: 600px) { header { grid-template-columns: 1fr auto; align-items: center; } .stats { grid-template-columns: repeat(2, 110px); } }

  /* Tabs as a rounded bar */
  nav { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
  nav button { border-bottom: 0 !important; border-radius: 10px; padding: 9px 13px; }
  nav button[aria-selected="true"] { background: linear-gradient(135deg, #1457d6, #0a3fa8); color: #fff; box-shadow: 0 2px 8px rgba(20,87,214,.35); }

  /* Cards */
  .card { background: linear-gradient(90deg, var(--blue), var(--orange)) top / 100% 3px no-repeat, var(--surface); border-color: var(--line); box-shadow: 0 2px 10px rgba(10,42,107,.06); padding-top: 18px; }
  .card h2, .big { color: var(--head); }
  .primary { background: var(--btn); box-shadow: 0 3px 10px rgba(217,100,10,.28); }
  .primary:disabled { background: var(--bar); box-shadow: none; }
  .btn { border-color: var(--line2); }
  .bar { background: var(--bar); }
  .bar i { background: linear-gradient(90deg, var(--blue), var(--orange)); }
  .chip { background: var(--chip); }
  select, input[type="time"], input[type="date"], input[type="number"], textarea { background: var(--bg); border-color: var(--line2); }
  .vline.cur { background: var(--hl); }
  .banner { background: var(--hl); border-left: 4px solid var(--orange); }
  /* Verses that have notes are highlighted like a marker pen; the verse being read keeps the orange tint */
  :root { --noted: #fff1a6; --noted-edge: #e0a800; --noted-fg: #17212f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --noted: #4a3f10; --noted-edge: #f2c230; --noted-fg: #fff6d0; } }
  :root[data-theme="dark"] { --noted: #4a3f10; --noted-edge: #f2c230; --noted-fg: #fff6d0; }
  body { font-size: 1rem; }
  textarea { min-height: 110px; line-height: 1.5; font-size: 1rem; overflow: hidden; resize: vertical; scroll-margin-bottom: 220px; }
  .reader { padding-bottom: 130px; }
  .fsbtn { appearance: none; background: var(--chip); color: var(--fg); border: 1px solid var(--line2, var(--line)); border-radius: 10px; font: 700 .95rem var(--ui); padding: 6px 12px; cursor: pointer; }
  .fsrow { display: flex; gap: 6px; align-items: center; }
  .reminder { background: var(--noted); color: var(--noted-fg); border-left: 4px solid var(--noted-edge); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: .95rem; }
  .sugbar { display: flex; flex-direction: column; gap: 6px; font-family: var(--ui); margin: -2px 0 4px; }
  .sugrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; }
  .sugrow .lab { font-weight: 700; color: var(--muted); font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; }
  .sugbad { color: #b3261e; font-weight: 800; text-decoration: underline wavy #b3261e; }
  .sugchip { appearance: none; background: var(--chip); color: var(--fg); border: 1px solid var(--line2, var(--line)); border-radius: 99px; font: 600 .9rem var(--ui); padding: 4px 12px; cursor: pointer; }
  .sugchip:hover { background: var(--accent); color: var(--accent-fg); }
  .sugchip.add { background: none; color: var(--muted); font-weight: 500; font-size: .8rem; }
  @media (max-width: 600px) {
    .rtop .fsrow { flex-basis: 100%; order: 4; }
    .reminder { font-size: .82rem; font-weight: 600; padding: 8px 12px; }
    .ctl { gap: 6px; padding: 6px 8px; }
    .ctl button, .ctl select { font-size: .85rem; }
    .vline { gap: 8px; }
    .vacts { flex-direction: row-reverse; flex-wrap: wrap; justify-content: flex-end; }
    .cbtn, .nbtn { min-height: 38px; }
    .mynotes { padding: 8px 10px; }
  }
  .vline.noted { background: var(--noted); border-left-color: var(--noted-edge); }
  .vline.noted .txt { color: var(--noted-fg); }
  .vline.noted.cur { background: var(--noted); border-left-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .vline .txt { user-select: text; -webkit-user-select: text; cursor: text; }
  .cbtn { appearance: none; flex: none; background: var(--chip); color: var(--muted); border: 0; border-radius: 8px; font: 600 .75rem var(--ui); padding: 6px 9px; cursor: pointer; }
  .cbtn.ok { background: var(--ok); color: #fff; }
  .vacts { display: flex; flex-direction: column; gap: 4px; flex: none; }
  .mynotes { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 14px; padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--noted-edge); border-radius: 12px; background: var(--noted); color: var(--noted-fg); }
  .mynotes h3 { margin: 0; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
  .mynotes .mn { display: flex; flex-direction: column; gap: 2px; border-top: 1px dashed rgba(0,0,0,.18); padding-top: 8px; font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
  .mynotes .mn:first-of-type { border-top: 0; padding-top: 0; }
  .mynotes .mn .vt { font-weight: 800; }
  .mynotes .mn .vq { font-family: var(--scripture); font-style: italic; opacity: .8; font-size: .85rem; }
  .ctl { bottom: var(--foot-h); border-color: var(--line2); box-shadow: 0 -2px 10px rgba(10,42,107,.1); }
  .sumsec h3, .guide .gb strong { color: var(--accent); }
  .rtop h1 { color: var(--head); }

  /* Bottom bar */
  .devfoot { background: linear-gradient(90deg, #082357, #1457d6); border-top: 3px solid var(--orange); box-shadow: 0 -4px 14px rgba(10,42,107,.25); flex-wrap: nowrap; white-space: nowrap; padding: 8px 10px max(8px, env(safe-area-inset-bottom)); height: auto; }
  .devfoot strong { color: #e4eeff; }
  .devfoot a { color: #ffc266; }

  /* Launch splash: blue blending into orange */
  #splash { background: radial-gradient(circle at 50% 36%, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 45%), linear-gradient(180deg, #082357 0%, #1457d6 40%, #2a77e6 64%, #8dbcf5 78%, #ffd9a0 90%, #f5a02e 100%); }
  #splash .sub { color: #e4eeff; }
  #splash .dev { background: linear-gradient(90deg, #082357, #1457d6); border-top: 3px solid var(--orange); }

  /* Reader layout */
  .rtop { gap: 8px 12px; }
  .rtop h1 { white-space: nowrap; font-size: 1.7rem; }
  .rtop > .muted { flex-basis: 100%; order: 3; font-size: .85rem; margin-top: -4px; }
  .ctl { gap: 8px; padding: 8px 10px; }
  .ctl .msg:empty { display: none; }
  .ctl .btn, .ctl select { padding: 8px 10px; }
  .ctl .btn[aria-label="Background music"] { font-size: .85rem; }

  /* Header text hierarchy: church name big, then toolkit, then tagline */
  .org > div:last-child { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .org > div:last-child small:first-child { order: 1; font-size: clamp(1.2rem, 5.6vw, 1.7rem); font-weight: 800; letter-spacing: .04em; line-height: 1.15; color: #fff; text-transform: none; text-wrap: balance; }
  .org > div:last-child b { order: 2; font-size: 1.02rem; letter-spacing: .2em; color: #ffc266; line-height: 1.1; }
  .org > div:last-child small:last-child { order: 3; font-size: .68rem; letter-spacing: .16em; color: #dbe8ff; }
  #splash h1 { font-size: clamp(1.3rem, 6.4vw, 1.9rem); letter-spacing: .08em; line-height: 1.2; text-wrap: balance; }
  #splash h2 { font-size: clamp(1.6rem, 7.5vw, 2.4rem); margin-top: 6px; }
  #splash .mid > div:last-child { position: relative; z-index: 2; }
  #splash .glowicon { margin-bottom: 8px; }

  /* Header: church beside logo, toolkit + tagline centred, stats below */
  .org > small.church { font-size: clamp(1.2rem, 5.6vw, 1.7rem); font-weight: 800; letter-spacing: .04em; line-height: 1.15; color: #fff; text-transform: none; text-wrap: balance; min-width: 0; }
  .titlebox { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.25); }
  .titlebox b { font-size: clamp(1.35rem, 6.4vw, 1.9rem); letter-spacing: .2em; padding-left: .2em; color: #ffc266; line-height: 1.1; font-weight: 800; }
  .titlebox span { font-size: .72rem; letter-spacing: .2em; padding-left: .2em; text-transform: uppercase; color: #e4eeff; }
  .stats { grid-column: 1 / -1; }
  @media (min-width: 600px) { header { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); max-width: 420px; justify-self: center; width: 100%; } }
  /* Day box */
  .daybox { align-self: flex-start; display: inline-block; background: var(--chip); border: 1px solid var(--line2); border-left: 4px solid var(--orange); border-radius: 10px; padding: 7px 14px; font-weight: 700; font-size: .95rem; color: var(--head); }
</style>

    ta.setAttribute("spellcheck", "true");
    ta.addEventListener("input", later); ta.addEventListener("keyup", later); ta.addEventListener("click", later);
    ta.addEventListener("focus", later); ta.addEventListener("blur", function () { setTimeout(render, 200); });
    return bar;
  }
  function noteEditor(ck, v, onChange) {
    var cur = (state.notes[ck] || {})[v] || {};
    var w = h("div", { class: "ned" });
    [["fact", "Fact", "What the text plainly says, e.g. God created light on the first day."], ["insight", "Insight", "What God is showing me, the lesson for my life."], ["deed", "Deed", "What I will do, or a question I will ask myself."]].forEach(function (f) {
      var ta = h("textarea", { placeholder: f[2], "aria-label": f[1] + (v ? " for verse " + v : " for the whole chapter") });
      ta.value = cur[f[0]] || "";
      ta.fit = function () { ta.style.height = "auto"; if (ta.scrollHeight) ta.style.height = (ta.scrollHeight + 4) + "px"; };
      ta.addEventListener("input", ta.fit);
      setTimeout(ta.fit, 0);
      var cnt = h("span", { class: "note" });
      function upd() { var n = sentences(ta.value); cnt.textContent = n >= MIN_SENT ? "✓ " + n + " sentences. Enough to unlock." : n + " of " + MIN_SENT + " sentences needed to unlock"; cnt.style.color = n >= MIN_SENT ? "var(--ok)" : ""; }
      upd();
      ta.addEventListener("input", function () { saveNote(ck, v, f[0], ta.value); upd(); if (onChange) onChange(); });
      w.appendChild(h("label", null, f[1], ta, cnt));
      w.appendChild(attachSuggest(ta));
    });
    return w;
  }
  /* PC app only: Windows keeps sending the voice to the sound device that was active when the app started.
     Restarting the app makes it pick up the earphones that are connected now. */
  function audioBtn() {
    var b = h("button", { class: "btn", "aria-label": "Refresh audio for earphones", title: "Voice not in your earphones? Tap twice to restart the app's audio." }, "🎧 Refresh audio");
    b.addEventListener("click", function () {
      if (b.dataset.sure) { try { window.cbrPC.refreshAudio(); } catch (e) {} return; }
      b.dataset.sure = "1"; b.textContent = "Tap again to restart";
      setTimeout(function () { delete b.dataset.sure; b.textContent = "🎧 Refresh audio"; }, 4000);
    });
    return b;
  }
  try {
    if (window.cbrPC && navigator.mediaDevices && navigator.mediaDevices.addEventListener)
      navigator.mediaDevices.addEventListener("devicechange", function () {
        if (R && R.msg) setMsg("Sound device changed. If the voice is not in your earphones, press 🎧 Refresh audio.");
      });
  } catch (e) {}
  function copyText(t, cb) {
    function legacy() {
      var ok = false;
      try { var ta = document.createElement("textarea"); ta.value = t; ta.style.cssText = "position:fixed;opacity:0;top:0;left:0"; document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch (e) {}
      cb(ok);
    }
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(function () { cb(true); }, legacy); return; } } catch (e) {}
    legacy();
  }
  function navTarget(dir) {
    var d = S.rd;
    if (d.list) { var p = d.pos + dir; if (d.list[p]) return { b: d.list[p].b, c: d.list[p].c, list: d.list, pos: p }; return null; }
    var i = ALL.findIndex(function (x) { return x.b === d.b && x.c === d.c; }), n = ALL[i + dir];
    return n ? { b: n.b, c: n.c } : null;
  }
  function readerView() {
    var d = S.rd, ck = key(d.b, d.c);
    if (!state.started) state.started = {};
    if (!state.started[todayKey]) { state.started[todayKey] = Date.now(); persist(); }
    var verses = hasText(d.b, d.c) ? BIBLE[d.b][d.c] : null;
    R = { ck: ck, verses: verses, idx: -1, playing: false, token: 0, rows: [] };
    var box = h("div", { class: "reader" });
    var sub = d.list ? "Chapter " + (d.pos + 1) + " of " + d.list.length + " today" : "";
    box.appendChild(h("div", { class: "rtop" },
      h("button", { class: "btn", onclick: function () { go({ view: null }); } }, "← Back"),
      h("h1", { text: label(d.b, d.c) }),
      h("span", { class: "muted", text: sub }),
      fsControls()));
    var rem = h("div", { class: "reminder" });
    function remText() { rem.textContent = "To unlock today: read at least one chapter and write a Fact, an Insight and a Deed. Each one needs at least 3 sentences, so read slowly and take your time." + (reqProgress().total ? " Today's plan: " + reqProgress().done + " of " + reqProgress().total + " chapters read. Read the rest whenever you can." : ""); }
    remText(); R.remText = remText;
    box.appendChild(rem);
    box.appendChild(guideCard(false));
    var holder = h("div");
    function refresh() { holder.textContent = ""; holder.appendChild(unlockPanel()); if (R && R.renderMine) R.renderMine(); if (R && R.remText) R.remText(); }
    refresh();

    var doneBtn = h("button", { class: "primary" });
    function updateDone() { var dn = !!state.done[ck]; doneBtn.textContent = dn ? "✓ Finished (tap to undo)" : "I finished this chapter"; doneBtn.className = dn ? "btn" : "primary"; }
    doneBtn.addEventListener("click", function () {
      if (state.done[ck]) delete state.done[ck]; else state.done[ck] = todayKey;
      persist(); updateDone(); refresh();
    });
    updateDone();

    if (verses) {
      var list = h("div", { class: "verses" });
      verses.forEach(function (t, i) {
        var v = i + 1;
        var ed = null, edWrap = h("div", { hidden: true });
        var nb = h("button", { class: "nbtn" + (hasNote(ck, v) ? " has" : ""), "aria-label": "Notes for verse " + v }, "✎ Note");
        nb.addEventListener("click", function () {
          pauseSpeech();
          if (!ed) { ed = noteEditor(ck, v, function () { nb.className = "nbtn" + (hasNote(ck, v) ? " has" : ""); row.classList.toggle("noted", hasNote(ck, v)); refresh(); }); edWrap.appendChild(ed); }
          edWrap.hidden = !edWrap.hidden;
          if (!edWrap.hidden) { ed.querySelectorAll("textarea").forEach(function (x) { if (x.fit) x.fit(); }); setIdx(i); var first = ed.querySelector("textarea"); if (first) first.focus(); }
        });
        /* Plain text (not a button) so it can be selected and copied. A simple click still reads from here; dragging to select does not. */
        var txt = h("div", { class: "txt", tabindex: "0", role: "button", "aria-label": "Read from verse " + v }, t);
        txt.addEventListener("click", function () {
          var sel = window.getSelection ? String(window.getSelection()) : "";
          if (sel && sel.length) return;
          speakFrom(i);
        });
        txt.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); speakFrom(i); } });
        var cb = h("button", { class: "cbtn", "aria-label": "Copy verse " + v }, "⧉ Copy");
        cb.addEventListener("click", function () {
          copyText(label(d.b, d.c) + ":" + v + "  " + t, function (ok) {
            cb.textContent = ok ? "✓ Copied" : "Press Ctrl+C"; cb.className = "cbtn" + (ok ? " ok" : "");
            setTimeout(function () { cb.textContent = "⧉ Copy"; cb.className = "cbtn"; }, 1500);
          });
        });
        var row = h("div", { class: "vline" + (hasNote(ck, v) ? " noted" : "") }, h("span", { class: "num", text: String(v) }), txt, h("div", { class: "vacts" }, nb, cb));
        R.rows.push(row);
        list.appendChild(row); list.appendChild(edWrap);
      });
      box.appendChild(list);
    } else {
      var man = h("div", { class: "card" },
        h("strong", { text: "The text of this chapter is not on this device yet." }),
        h("p", { class: "muted", text: "Read it in your Bible, then add notes by verse number. Load the WEB file in Settings to read it here with the voice." }));
      var area = h("div", { class: "wrap" }), made = {};
      function addEd(v) {
        if (made[v] || !v) return; made[v] = true;
        area.appendChild(h("div", { class: "card" }, h("strong", { text: "Verse " + v }), noteEditor(ck, v, refresh)));
      }
      Object.keys(state.notes[ck] || {}).sort(function (a, b) { return a - b; }).forEach(function (v) { addEd(+v); });
      var vn = h("input", { type: "number", min: "1", max: "176", id: "vnum", placeholder: "Verse", "aria-label": "Verse number" });
      man.appendChild(h("div", { class: "row" }, vn, h("button", { class: "btn", onclick: function () { addEd(parseInt(vn.value, 10)); vn.value = ""; } }, "Add note")));
      box.appendChild(man); box.appendChild(area);
    }

    var mine = h("div");
    var chapEd = noteEditor(ck, 0, refresh);
    function renderMine() {
      mine.textContent = "";
      var ns = state.notes[ck] || {}, vs = Object.keys(ns).filter(function (k) { return +k > 0; }).sort(function (a, b) { return a - b; });
      if (!vs.length) return;
      var wrap = h("div", { class: "mynotes" }, h("h3", { text: "Notes I have made in " + label(d.b, d.c) }));
      vs.forEach(function (k) {
        var n = ns[k], item = h("div", { class: "mn" }, h("span", { class: "vt", text: "Verse " + k }));
        var vtxt = verses && verses[k - 1];
        if (vtxt) item.appendChild(h("span", { class: "vq", text: vtxt.length > 140 ? vtxt.slice(0, 140) + "…" : vtxt }));
        [["fact", "Fact"], ["insight", "Insight"], ["deed", "Deed"]].forEach(function (f) {
          if (n[f[0]] && n[f[0]].trim()) item.appendChild(h("span", null, h("b", { text: f[1] + ": " }), n[f[0]].trim()));
        });
        wrap.appendChild(item);
      });
      var fill = h("button", { class: "btn", onclick: function () {
        var tas = chapEd ? chapEd.querySelectorAll("textarea") : [];
        ["fact", "insight", "deed"].forEach(function (t, i) {
          var lines = [];
          vs.forEach(function (k) { var x = (ns[k][t] || "").trim(); if (x) lines.push("Verse " + k + ": " + x); });
          var ta = tas[i]; if (!ta || !lines.length) return;
          var add = lines.filter(function (l) { return ta.value.indexOf(l) === -1; });
          if (!add.length) return;
          ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/, "") + "\n" : "") + add.join("\n");
          ta.dispatchEvent(new Event("input"));
        });
        fill.textContent = "✓ Added below";
      } }, "Add my verse notes into the boxes below");
      wrap.appendChild(fill);
      mine.appendChild(wrap);
    }
    renderMine();
    R.renderMine = renderMine;
    box.appendChild(h("div", { class: "card" },
      h("strong", { text: "Notes for the whole chapter" }),
      h("p", { class: "muted", text: "Missed something while reading? Write your Facts, Insights and Deeds for this chapter here. Your verse notes are shown first so you can refer to them." }),
      mine,
      chapEd));

    var prev = navTarget(-1), next = navTarget(1);
    box.appendChild(doneBtn);
    box.appendChild(h("div", { class: "row" },
      prev ? h("button", { class: "btn", onclick: function () { go({ rd: prev }); } }, "← Previous chapter") : null,
      next ? h("button", { class: "btn", onclick: function () { go({ rd: next }); } }, "Next chapter →") : h("button", { class: "btn", onclick: function () { go({ view: null }); } }, "Back to today")));
    box.appendChild(holder);

    if (verses && TTS) {
      var msg = h("div", { class: "msg" });
      var mb = h("button", { class: "btn", "aria-label": "Background music" });
      function updMb() { mb.textContent = state.music ? "♪ Music on" : "♪ Music off"; }
      mb.addEventListener("click", function () { state.music = !state.music; persist(); updMb(); if (state.music) { if (R && R.playing) musicStart(); } else musicStop(); });
      updMb();
      R.msg = msg;
      R.playBtn = h("button", { class: "primary play", onclick: function () { if (R.playing) pauseSpeech(); else speakFrom(Math.max(0, R.idx)); } }, "▶ Play");
      var rs = h("select", { "aria-label": "Speed" });
      [[0.8, "Slow"], [0.9, "Relaxed"], [1, "Normal"], [1.15, "Brisk"]].forEach(function (r) { rs.appendChild(h("option", { value: String(r[0]), selected: state.rate === r[0] }, r[1])); });
      rs.addEventListener("change", function () { state.rate = +rs.value; persist(); if (R.playing) speakFrom(R.idx); });
      box.appendChild(h("div", { class: "ctl" },
        h("button", { class: "btn", "aria-label": "Previous verse", onclick: function () { speakFrom(Math.max(0, R.idx - 1)); } }, "⏮"),
        R.playBtn,
        h("button", { class: "btn", "aria-label": "Next verse", onclick: function () { speakFrom(Math.min(verses.length - 1, R.idx + 1)); } }, "⏭"),
        rs, mb, window.cbrPC ? audioBtn() : null, msg));
    }
    return box;
  }

  function refreshIfIdle() { if (S.view !== "reader") render(); }
  function loadFromStore() { idbGet("web", function (obj) { if (obj && mergeBible(obj)) refreshIfIdle(); }); }
  (function () {
    var sp = document.getElementById("splash"); if (!sp) return;
    var gone = false;
    function hide() { if (gone) return; gone = true; sp.classList.add("out"); setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 700); }
    sp.addEventListener("click", hide);
    setTimeout(hide, 2800);
  })();
  render();
  try {
    fetch("web.json").then(function (r) { if (!r.ok) throw new Error("no file"); return r.json(); }).then(function (obj) {
      if (mergeBible(obj)) { idbSet("web", obj, function () {}); refreshIfIdle(); }
    }).catch(loadFromStore);
  } catch (e) { loadFromStore(); }
})();
</script>
